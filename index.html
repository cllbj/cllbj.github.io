<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>物品借还管理工具</title>
<!-- 加上捕获错误的全局提示，一旦有报错直接弹窗 -->
<script>
  window.onerror = function(msg) {
    alert("系统提示：代码运行出错，请检查网络或刷新。\n错误信息：" + msg);
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs2@0.0.2/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --primary:#2563eb; --primary-d:#1d4ed8; --success:#10b981; --success-d:#059669;
  --warning:#f59e0b; --danger:#ef4444; --bg:#f1f5f9; --card:#fff;
  --text:#1e293b; --muted:#64748b; --border:#e2e8f0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}

.app{max-width:1180px;margin:0 auto;padding:16px 16px 60px}
.app-header{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 18px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;
  border-radius:14px;box-shadow:0 4px 14px rgba(37,99,235,.25);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{font-size:24px}
.brand h1{font-size:18px;font-weight:700;letter-spacing:.5px}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.header-actions .btn{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3)}
.header-actions .btn:hover{background:rgba(255,255,255,.3)}
.user-chip{font-size:13px;background:rgba(255,255,255,.18);padding:6px 12px;border-radius:20px;
  border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;gap:8px}
.user-chip b{font-weight:700}

.tabs{display:flex;gap:6px;margin:18px 0 14px;background:#fff;padding:6px;border-radius:12px;
  box-shadow:0 1px 3px rgba(15,23,42,.06);overflow-x:auto}
.tab{padding:9px 20px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted);
  white-space:nowrap;transition:.18s}
.tab:hover{background:#f1f5f9;color:var(--text)}
.tab.active{background:var(--primary);color:#fff;box-shadow:0 2px 8px rgba(37,99,235,.3)}

.panel{display:none}
.panel.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:9px;
  background:#fff;outline:none;transition:.18s}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.toolbar .input{flex:1;min-width:160px;width:auto}
.toolbar select.input{flex:0 0 130px;min-width:130px;cursor:pointer}

.btn{padding:9px 16px;border-radius:9px;font-size:14px;font-weight:600;
  background:#fff;color:var(--text);border:1px solid var(--border);transition:.18s;white-space:nowrap}
.btn:hover{background:#f8fafc;border-color:#cbd5e1}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn.primary:hover{background:var(--primary-d)}
.btn.success{background:var(--success);color:#fff;border-color:var(--success)}
.btn.success:hover{background:var(--success-d)}
.btn.danger{background:#fff;color:var(--danger);border-color:#fecaca}
.btn.danger:hover{background:#fef2f2}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.stats{font-size:13px;color:var(--muted);margin-bottom:12px;padding-left:2px}
.stats b{color:var(--text)}
.stats .warn{color:var(--danger);font-weight:700}

.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.item-card{background:var(--card);border-radius:13px;padding:14px;border:1px solid var(--border);
  box-shadow:0 1px 3px rgba(15,23,42,.05);display:flex;flex-direction:column;gap:8px;
  transition:.2s;position:relative;overflow:hidden}
.item-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--success)}
.item-card.borrowed::before{background:var(--warning)}
.item-card.pending::before{background:#3b82f6}
.item-card:hover{box-shadow:0 6px 18px rgba(15,23,42,.1);transform:translateY(-2px)}
.card-top{display:flex;justify-content:space-between;align-items:center}
.code{font-size:12px;font-weight:700;color:var(--muted);background:#f1f5f9;
  padding:2px 8px;border-radius:6px;letter-spacing:.4px}
.badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px}
.badge.available{background:#dcfce7;color:#15803d}
.badge.borrowed{background:#fef3c7;color:#b45309}
.badge.pending{background:#dbeafe;color:#1d4ed8}
.badge.overdue{background:#fee2e2;color:#b91c1c}
.item-name{font-size:16px;font-weight:700;line-height:1.3;word-break:break-all}
.item-meta{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11.5px;color:#475569;background:#f1f5f9;padding:2px 8px;border-radius:5px}
.item-loc{font-size:12.5px;color:var(--muted)}
.borrow-info{font-size:12.5px;color:#b45309;background:#fffbeb;padding:6px 9px;
  border-radius:7px;border:1px solid #fef3c7}
.borrow-info.over{color:#b91c1c;background:#fef2f2;border-color:#fecaca}
.borrow-info.pend{color:#1d4ed8;background:#eff6ff;border-color:#bfdbfe}
.card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px;
  border-top:1px dashed var(--border)}

.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 20px;font-size:14px}
.empty .big{font-size:40px;display:block;margin-bottom:10px;opacity:.5}
.empty-sm{text-align:center;color:var(--muted);padding:20px;font-size:13px}

/* 扫码页 */
.scan-wrap{background:#fff;border-radius:14px;padding:20px;border:1px solid var(--border);
  max-width:640px;margin:0 auto;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.reader{width:100%;border-radius:12px;overflow:hidden;margin-bottom:14px;
  display:none !important;min-height:0;background:transparent}
.reader.active{display:block !important;min-height:280px;background:#0f172a}
.scan-controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.divider{text-align:center;color:var(--muted);font-size:13px;margin:18px 0;position:relative}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:38%;height:1px;background:var(--border)}
.divider::before{left:0}.divider::after{right:0}
.manual-row{display:flex;gap:8px}
.hint{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.7;
  background:#f8fafc;padding:10px 12px;border-radius:9px;border-left:3px solid #cbd5e1}
.hint code{background:#e2e8f0;padding:1px 5px;border-radius:4px;font-size:12px}

/* 记录表 */
.table-wrap{background:#fff;border-radius:13px;border:1px solid var(--border);overflow:auto}
.table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:860px}
.table th{background:#f8fafc;color:var(--muted);font-weight:600;text-align:left;
  padding:11px 14px;border-bottom:1px solid var(--border);font-size:12.5px;white-space:nowrap}
.table td{padding:11px 14px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.table tr:last-child td{border-bottom:none}
.table tr:hover td{background:#f8fafc}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill.borrow{background:#fef3c7;color:#b45309}
.pill.return{background:#dcfce7;color:#15803d}
.pill.pending{background:#dbeafe;color:#1d4ed8}
.pill.approved{background:#dcfce7;color:#15803d}
.pill.rejected{background:#fee2e2;color:#b91c1c}

/* 模态框 */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;
  animation:fade .18s ease}
.modal{background:#fff;border-radius:16px;width:100%;max-width:470px;max-height:92vh;
  overflow-y:auto;box-shadow:0 20px 50px rgba(15,23,42,.3);animation:pop .22s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;
  padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px;font-weight:700}
.icon-btn{width:30px;height:30px;border-radius:8px;color:var(--muted);font-size:15px;
  display:flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn:hover{background:#f1f5f9;color:var(--text)}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:13px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;
  border-top:1px solid var(--border);background:#f8fafc;border-radius:0 0 16px 16px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;font-weight:600;color:#475569}
.field .req{color:var(--danger)}
.row{display:flex;gap:12px}
.row .field{flex:1;min-width:0}

.item-brief{background:#f8fafc;border-radius:10px;padding:12px 14px;
  border:1px solid var(--border);font-size:13.5px;line-height:1.7}
.item-brief .n{font-size:15px;font-weight:700;margin-bottom:4px}
.item-brief .m{color:var(--muted);font-size:12.5px}

.qr-body{align-items:center;text-align:center}
.qr-box{padding:12px;background:#fff;border-radius:10px;display:inline-block;
  border:1px solid var(--border)}
.qr-box img,.qr-box canvas{display:block}
.qr-name{font-size:16px;font-weight:700;margin-top:4px}
.qr-code{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);
  background:#0f172a;color:#fff;padding:11px 22px;border-radius:10px;font-size:14px;
  font-weight:600;opacity:0;transition:.3s;z-index:99999;pointer-events:none;
  box-shadow:0 8px 24px rgba(15,23,42,.35);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:#059669}
.toast.err{background:#dc2626}

/* 管理页 */
.admin-section{background:#fff;border-radius:13px;border:1px solid var(--border);
  padding:16px 18px;margin-bottom:14px}
.admin-section h2{font-size:15px;font-weight:700;margin-bottom:12px;color:var(--text)}
.admin-card{display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;
  background:#fafbfc;flex-wrap:wrap}
.admin-card .muted{color:var(--muted);font-size:12.5px}
.admin-actions{display:flex;gap:6px;flex-shrink:0}

/* 登录页 */
.login-page{position:fixed;inset:0;background:linear-gradient(135deg,#2563eb,#4f46e5);
  display:flex;align-items:center;justify-content:center;z-index:3000;padding:16px;overflow-y:auto;}
.login-box{background:#fff;border-radius:18px;padding:28px 26px;width:100%;max-width:380px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .3s ease;margin:auto;}
.login-brand{font-size:20px;font-weight:700;text-align:center;margin-bottom:20px;color:var(--text)}
.login-tabs{display:flex;gap:6px;background:#f1f5f9;padding:5px;border-radius:10px;margin-bottom:20px}
.login-tab{flex:1;padding:8px;border-radius:7px;font-size:14px;font-weight:600;color:var(--muted);transition:.18s}
.login-tab.active{background:#fff;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.login-form{display:flex;flex-direction:column;gap:12px}
.login-form label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:#475569}
.login-tip{font-size:12px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6}
.login-tip code{background:#f1f5f9;padding:1px 5px;border-radius:4px}

@media (max-width:560px){
  .app{padding:12px 12px 50px}
  .brand h1{font-size:16px}
  .item-grid{grid-template-columns:1fr}
  .toolbar select.input{flex:1}
  .row{flex-direction:column}
  .admin-card{flex-direction:column;align-items:stretch}
  .admin-actions{justify-content:flex-end}
}
</style>
</head>
<body>

<!-- ============ 登录页 ============ -->
<div class="login-page" id="loginPage" style="display:none">
  <div class="login-box">
    <div class="login-brand">📦 物品借还管理</div>
    <div class="login-tabs">
      <button class="login-tab active" data-mode="login">登录</button>
      <button class="login-tab" data-mode="register">注册</button>
    </div>

    <!-- 登录表单 -->
    <div id="loginForm" class="login-form">
      <label>手机号
        <input class="input" id="loginPhone" type="tel" maxlength="11" placeholder="11 位手机号">
      </label>
      <label>密码
        <input class="input" id="loginPwd" type="password" placeholder="登录密码">
      </label>
      <button class="btn primary" id="btnLogin" style="margin-top:6px" onclick="doLogin()">登录</button>
    </div>

    <!-- 注册表单 -->
    <div id="registerForm" class="login-form" style="display:none">
      <label>手机号 <b class="req">*</b>
        <input class="input" id="regPhone" type="tel" maxlength="11" placeholder="11 位手机号">
      </label>
      <label>姓名 <b class="req">*</b>
        <input class="input" id="regName" placeholder="真实姓名">
      </label>
      <label>部门 / 工号
        <input class="input" id="regDept" placeholder="选填">
      </label>
      <label>设置密码 <b class="req">*</b>
        <input class="input" id="regPwd" type="password" placeholder="至少 4 位">
      </label>
      <label>确认密码 <b class="req">*</b>
        <input class="input" id="regPwd2" type="password" placeholder="再次输入密码">
      </label>
      <button class="btn primary" id="btnRegister" style="margin-top:6px" onclick="doRegister()">注册</button>
      <div class="login-tip">注册后需管理员审核通过才能登录<br>管理员手机号注册将直接通过</div>
    </div>
  </div>
</div>

<!-- ============ 主应用 ============ -->
<div class="app" id="app">
  <header class="app-header">
    <div class="brand"><span class="logo">📦</span><h1>物品借还管理工具</h1></div>
    <div class="header-actions">
      <div class="user-chip" id="userChip" style="display:none">
        <span>👤 <b id="userName"></b><span id="userRole" style="opacity:.8"></span></span>
      </div>
      <button class="btn" id="btnExport">导出备份</button>
      <button class="btn" id="btnImport">导入备份</button>
      <button class="btn" id="btnLogout">退出</button>
      <input type="file" id="importFile" accept=".json" hidden>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="items">📋 物品列表</button>
    <button class="tab" data-tab="scan">📷 扫码借还</button>
    <button class="tab" data-tab="records">🕘 借还记录</button>
    <button class="tab" data-tab="admin" data-admin style="display:none">🛡 待审批 <span id="adminBadge" style="display:none;background:#ef4444;color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-left:4px"></span></button>
  </nav>

  <main>
    <section class="panel active" id="panel-items">
      <div class="toolbar">
        <input type="search" class="input" id="searchInput" placeholder="搜索：名称 / 编号 / 分类 / 位置">
        <select class="input" id="filterStatus">
          <option value="all">全部状态</option>
          <option value="available">在库</option>
          <option value="borrowed">已借出</option>
          <option value="pending">待审批</option>
        </select>
        <button class="btn primary" id="btnAddItem">＋ 添加物品</button>
        <button class="btn" id="btnPrintAll">🖨 打印全部标签</button>
      </div>
      <div class="stats" id="stats"></div>
      <div class="item-grid" id="itemList"></div>
    </section>

    <section class="panel" id="panel-scan">
      <div class="scan-wrap">
        <div id="reader" class="reader"></div>
        <div class="scan-controls">
          <button class="btn primary" id="btnStartScan">📷 开始扫码</button>
          <button class="btn" id="btnStopScan" disabled>停止</button>
          <button class="btn" id="btnScanFile">🖼 从图片识别</button>
          <input type="file" accept="image/*" id="qrFile" hidden>
        </div>
        <div class="divider">或手动输入</div>
        <div class="manual-row">
          <input class="input" id="manualInput" placeholder="输入物品编号 / ID，也可用 USB 扫码枪">
          <button class="btn primary" id="btnManual">确定</button>
        </div>
      </div>
    </section>

    <section class="panel" id="panel-records">
      <div class="toolbar">
        <input type="search" class="input" id="recordSearch" placeholder="搜索记录：物品 / 借用人">
        <button class="btn danger" id="btnClearRecords">清空全部记录</button>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>时间</th><th>操作</th><th>物品</th><th>编号</th>
              <th>操作人</th><th>应还日期</th><th>状态</th><th>备注</th><th></th>
            </tr>
          </thead>
          <tbody id="recordBody"></tbody>
        </table>
      </div>
    </section>

    <section class="panel" id="panel-admin">
      <div class="admin-section">
        <h2>👥 待审核用户</h2>
        <div id="pendingUsers"></div>
      </div>
      <div class="admin-section">
        <h2>🔁 待审批借还</h2>
        <div id="pendingRecords"></div>
      </div>
      <div class="admin-section">
        <h2>👤 全部用户</h2>
        <div id="allUsers"></div>
      </div>
    </section>
  </main>
</div>

<script>
/* ============================================================
 *  配置区
 * ============================================================ */
const SUPER_ADMIN_PHONE = '15991972976';   // ← 请改成你自己的手机号
const PUBLIC_BASE       = 'https://cllbj.github.io/';

/* ============================================================
 *  基础工具
 * ============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function pad(n) { return String(n).padStart(2, '0'); }
function todayStr(d = new Date()) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function fmtTime(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function toast(msg, type = '') {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => t.remove(), 350);
  }, 3000);
}

/* ============================================================
 *  全局状态
 * ============================================================ */
let state = { items: [], records: [], users: [] };
let currentUser = null;
let dataLoaded = false; // 防止网络失败时覆盖云端空数据

/* ============================================================
 *  密码哈希
 * ============================================================ */
async function hashPwd(phone, pwd) {
  const str = phone + '::' + pwd + '::cllbj_v1';
  if (window.crypto?.subtle) {
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch (e) { /* 降级 */ }
  }
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  return 'x' + (h >>> 0).toString(16);
}

/* ============================================================
 *  Supabase 云端存储

/* ============================================================
 *  物品编号 / 二维码
 * ============================================================ */
function nextCode() {
  let max = 0;
  state.items.forEach(it => {
    const m = /^A(\d+)$/.exec(it.code || '');
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  return 'A' + String(max + 1).padStart(3, '0');
}

function qrText(item) {
  return `${PUBLIC_BASE}?item=${encodeURIComponent(item.code || item.id)}`;
}

function parseScan(text) {
  const s = String(text || '').trim();
  if (!s) return '';
  try {
    const u = new URL(s);
    const p = u.searchParams.get('item') || u.searchParams.get('item_id');
    if (p) return p;
  } catch (e) {}
  if (/^ITEM:/i.test(s)) return s.slice(5);
  return s;
}

function findItemByScan(text) {
  const key = parseScan(text);
  if (!key) return null;
  return state.items.find(i => i.id === key || i.code === key) || null;
}

function genQrDataUrl(text, size = 200) {
  const tmp = document.createElement('div');
  tmp.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(tmp);
  let url = '';
  try {
    new QRCode(tmp, { text, width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
    const canvas = tmp.querySelector('canvas');
    if (canvas) url = canvas.toDataURL('image/png');
  } catch (e) { console.error(e); }
  document.body.removeChild(tmp);
  return url;
}

/* ============================================================
 *  图片解码
 * ============================================================ */
async function decodeImage(file) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        let width = img.width, height = img.height;
        const maxSize = 1000;
        if (width > maxSize || height > maxSize) {
          if (width > height) { height = Math.round((height * maxSize) / width); width = maxSize; }
          else { width = Math.round((width * maxSize) / height); height = maxSize; }
        }
        canvas.width = width; canvas.height = height;
        ctx.drawImage(img, 0, 0, width, height);

        const imageData = ctx.getImageData(0, 0, width, height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert",
        });
        if (code && code.data) { resolve(code.data); return; }

        const tmp = new Html5Qrcode('reader');
        canvas.toBlob(async (blob) => {
          const smallFile = new File([blob], file.name, { type: 'image/jpeg' });
          try {
            const res = await tmp.scanFile(smallFile, false);
            tmp.clear(); resolve(res);
          } catch (err) {
            tmp.clear(); resolve(null);
          }
        }, 'image/jpeg', 0.9);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ============================================================
 *  状态展示
 * ============================================================ */
function statusInfo(item) {
  const s = item.status;
  if (s === 'available') return { label: '在库', cls: 'available', action: '借出', actionCls: 'primary' };
  if (s === 'borrowed')  return { label: '已借出', cls: 'borrowed', action: '归还', actionCls: 'success' };
  if (s === 'pending_borrow') return { label: '借出待审批', cls: 'pending', action: '等待审批', actionCls: '', disabled: true };
  if (s === 'pending_return') return { label: '归还待审批', cls: 'pending', action: '等待审批', actionCls: '', disabled: true };
  return { label: s || '未知', cls: '', action: '', actionCls: '' };
}

/* ============================================================
 *  模态框
 * ============================================================ */
function showModal(innerHtml) {
  const mask = document.createElement('div');
  mask.className = 'modal-mask';
  mask.innerHTML = `<div class="modal">${innerHtml}</div>`;
  document.body.appendChild(mask);

  const close = () => { mask.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);

  mask.addEventListener('mousedown', e => { if (e.target === mask) close(); });
  $$('[data-close]', mask).forEach(b => b.addEventListener('click', close));

  const first = mask.querySelector('input,textarea');
  if (first) setTimeout(() => first.focus(), 60);

  return { mask, close, $: s => mask.querySelector(s) };
}

    q('#m-ok').addEventListener('click', async () => {
      const due = q('#m-due').value || '';
      const remark = q('#m-remark').value.trim();
      await submitBorrow(item.id, due, remark);
      close();
    });
    return;
  }

  if (s === 'borrowed') {
    const overdue = item.dueDate && item.dueDate < todayStr();
    const { close, $: q } = showModal(`
      <div class="modal-head">
        <h3>📥 提交归还申请</h3>
        <button class="icon-btn" data-close>✕</button>
      </div>
      <div class="modal-body">
        <div class="item-brief">
          <div class="n">${esc(item.name)}</div>
          <div class="m">
            编号 ${esc(item.code)}<br>
            借用人：<b>${esc(item.borrower)}</b> · 借出日期：${esc(item.borrowDate)}
            ${item.dueDate ? `<br>应还日期：<span style="color:${overdue ? '#dc2626' : '#64748b'}">${esc(item.dueDate)}${overdue ? '（已逾期）' : ''}</span>` : ''}
          </div>
        </div>
        <label class="field"><span>归还备注</span>
          <textarea class="input" id="m-remark" rows="2" placeholder="选填，如：外观完好 / 有轻微磨损"></textarea></label>
        <div class="hint" style="margin-top:0">
          提交后物品将被锁定为「归还待审批」，需管理员确认后正式入库。
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" data-close>取消</button>
        <button class="btn success" id="m-ok">提交归还申请</button>
      </div>
    `);

    q('#m-ok').addEventListener('click', async () => {
      const remark = q('#m-remark').value.trim();
      await submitReturn(item.id, remark);
      close();
    });
  }
}

async function submitBorrow(itemId, dueDate, remark) {
  await refreshData();
  const item = state.items.find(i => i.id === itemId);
  if (!item) { toast('物品不存在', 'err'); return; }
  if (item.status !== 'available') {
    toast('该物品已被他人申请或借出', 'err');
    renderAll();
    return;
  }

  const me = currentUser;
  item.status = 'pending_borrow';
  item.lockBy = me.id;
  item.lockByName = me.name;
  item.lockAt = Date.now();
  item.pendingDueDate = dueDate;

  state.records.push({
    id: uid(), itemId: item.id, itemName: item.name, itemCode: item.code,
    type: 'borrow', person: me.name, personId: me.id, personPhone: me.phone,
    time: Date.now(), dueDate, remark, status: 'pending'
  });

  const ok = await saveData();
  renderAll();
  if (ok) toast('借出申请已提交，等待管理员审批', 'ok');
}

async function submitReturn(itemId, remark) {
  await refreshData();
  const item = state.items.find(i => i.id === itemId);
  if (!item) { toast('物品不存在', 'err'); return; }
  if (item.status !== 'borrowed') {
    toast('该物品状态已变化', 'err');
    renderAll();
    return;
  }

  const me = currentUser;
  item.status = 'pending_return';
  item.lockBy = me.id;
  item.lockByName = me.name;
  item.lockAt = Date.now();

  state.records.push({
    id: uid(), itemId: item.id, itemName: item.name, itemCode: item.code,
    type: 'return', person: me.name, personId: me.id, personPhone: me.phone,
    time: Date.now(), dueDate: item.dueDate || '', remark, status: 'pending'
  });

  const ok = await saveData();
  renderAll();
  if (ok) toast('归还申请已提交，等待管理员审批', 'ok');
}

/* ============================================================
 *  审批
 * ============================================================ */
async function approveRecord(recordId) {
  if (!currentUser?.isAdmin) return;
  await refreshData();
  const rec = state.records.find(r => r.id === recordId);
  if (!rec || rec.status !== 'pending') { toast('该申请已处理', 'err'); renderAll(); return; }
  const item = state.items.find(i => i.id === rec.itemId);
  if (!item) { toast('物品不存在', 'err'); return; }

  if (rec.type === 'borrow') {
    item.status = 'borrowed';
    item.borrower = rec.person;
    item.borrowerId = rec.personId;
    item.borrowDate = todayStr(new Date(rec.time));
    item.dueDate = rec.dueDate || '';
    item.borrowRemark = rec.remark || '';
  } else {
    item.status = 'available';
    item.borrower = ''; item.borrowerId = ''; item.borrowDate = '';
    item.dueDate = ''; item.borrowRemark = '';
  }
  delete item.lockBy; delete item.lockByName; delete item.lockAt; delete item.pendingDueDate;

  rec.status = 'approved';
  rec.reviewedBy = currentUser.name;
  rec.reviewedAt = Date.now();

  await saveData();
  renderAll();
  toast('已通过审批', 'ok');
}

async function rejectRecord(recordId) {
  if (!currentUser?.isAdmin) return;
  await refreshData();
  const rec = state.records.find(r => r.id === recordId);
  if (!rec || rec.status !== 'pending') { toast('该申请已处理', 'err'); renderAll(); return; }
  const item = state.items.find(i => i.id === rec.itemId);
  if (!item) { toast('物品不存在', 'err'); return; }

  if (rec.type === 'borrow') item.status = 'available';
  else item.status = 'borrowed';

  delete item.lockBy; delete item.lockByName; delete item.lockAt; delete item.pendingDueDate;

  rec.status = 'rejected';
  rec.reviewedBy = currentUser.name;
  rec.reviewedAt = Date.now();

  await saveData();
  renderAll();
  toast('已拒绝申请', 'ok');
}

async function approveUser(userId) {
  if (!currentUser?.isAdmin) return;
  await refreshData();
  const u = state.users.find(x => x.id === userId);
  if (!u) return;
  u.status = 'approved';
  await saveData();
  renderAll();
  toast('用户已通过审核', 'ok');
}

async function rejectUser(userId) {
  if (!currentUser?.isAdmin) return;
  await refreshData();
  const u = state.users.find(x => x.id === userId);
  if (!u) return;
  if (u.isAdmin && u.phone === SUPER_ADMIN_PHONE) {
    toast('不能禁用超级管理员', 'err');
    return;
  }
  u.status = 'rejected';
  await saveData();
  renderAll();
  toast('用户已拒绝/禁用', 'ok');
}

/* ============================================================
 *  打印
 * ============================================================ */
function printLabels(items) {
  if (!items.length) { toast('没有可打印的物品', 'err'); return; }
  if (typeof QRCode === 'undefined') { toast('二维码库未加载，请联网刷新', 'err'); return; }

  const labels = items.map(it => {
    const url = genQrDataUrl(qrText(it), 220);
    return `<div class="label">
      <img src="${url}" alt="qr">
      <div class="l-name">${esc(it.name)}</div>
      <div class="l-code">${esc(it.code)}</div>
    </div>`;
  }).join('');

  const win = window.open('', '_blank');
  if (!win) { toast('请允许浏览器弹出窗口', 'err'); return; }

  win.document.write(`<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
  <title>打印二维码标签</title>
  <style>
    @page { margin: 8mm; }
    body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; margin: 0; }
    .label { display:inline-flex; flex-direction:column; align-items:center; justify-content:center;
             width:42mm; height:34mm; border:1px dashed #cbd5e1; margin:2mm;
             page-break-inside:avoid; vertical-align:top; overflow:hidden; }
    .label img { width:20mm; height:20mm; }
    .l-name { font-size:9pt; font-weight:700; margin-top:1mm; max-width:38mm;
              text-align:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .l-code { font-size:8pt; color:#64748b; }
    @media print { .label { border-color:#e2e8f0; } }
  </style></head><body>${labels}</body></html>`);
  win.document.close();
  setTimeout(() => { win.focus(); win.print(); }, 500);
}

/* ============================================================
 *  扫码
 * ============================================================ */
let scanner = null;
let isScanning = false;
let scanLock = false;

function updateScanButtons() {
  $('#btnStartScan').disabled = isScanning;
  $('#btnStopScan').disabled = !isScanning;
}

async function startScan() {
  if (isScanning) return;
  if (!currentUser) { showLogin(); return; }
  if (typeof Html5Qrcode === 'undefined') {
    toast('扫码库未加载，请联网后刷新页面', 'err');
    return;
  }
  $('#reader').classList.add('active');
  scanner = new Html5Qrcode('reader');
  try {
    await scanner.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: function(viewfinderWidth, viewfinderHeight) {
          const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
          const qrboxSize = Math.floor(minEdge * 0.75);
          return { width: qrboxSize, height: qrboxSize };
        },
        aspectRatio: 1.0
      },
      onScanSuccess,
      () => {}
    );
    isScanning = true;
    updateScanButtons();
  } catch (err) {
    console.error(err);
    scanner = null;
    toast('无法启动摄像头，请查看下方提示', 'err');
    alert('无法启动摄像头。\n\n常见原因：浏览器在「直接打开本地 HTML 文件」时会禁用摄像头权限。\n\n解决方案：\n1) 在文件目录下运行：python -m http.server 8000\n   然后浏览器访问 http://localhost:8000\n2) 或使用 USB 扫码枪 / 手动输入编号。');
  }
}

async function stopScan() {
  if (!isScanning || !scanner) return;
  try {
    await scanner.stop();
    scanner.clear();
  } catch (e) { /* 忽略 */ }
  isScanning = false;
  scanner = null;
  $('#reader').classList.remove('active');
  updateScanButtons();
}

async function onScanSuccess(text) {
  if (scanLock) return;
  scanLock = true;
  await stopScan();

  const item = findItemByScan(text);
  if (!item) {
    toast('未找到对应物品：' + text.slice(0, 30), 'err');
    alert('未找到对应物品。\n扫描内容：' + text + '\n\n请确认该物品已在「物品列表」中录入。');
  } else {
    openTradeModal(item);
  }
  scanLock = false;
}

/* ============================================================
 *  登录注册
 * ============================================================ */
function showLogin() {
  $('#loginPage').style.display = 'flex';
  $('#app').style.display = 'none';
  switchLoginTab('login');
}

function hideLogin() {
  $('#loginPage').style.display = 'none';
  $('#app').style.display = 'block';
}

function switchLoginTab(mode) {
  $$('.login-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  $('#loginForm').style.display = mode === 'login' ? 'flex' : 'none';
  $('#registerForm').style.display = mode === 'register' ? 'flex' : 'none';
}

async function doLogin() {
  const phone = $('#loginPhone').value.trim();
  const pwd = $('#loginPwd').value;
  if (!/^1[3-9]\d{9}$/.test(phone)) return toast('手机号格式不正确', 'err');
  if (!pwd) return toast('请输入密码', 'err');

  const btn = $('#btnLogin');
  const oldText = btn.textContent;
  btn.disabled = true; btn.textContent = '验证中...';

  try {
    await refreshData();
    const u = state.users.find(x => x.phone === phone);
    if (!u) throw new Error('该手机号未注册');
    
    const hash = await hashPwd(phone, pwd);
    if (u.pwdHash !== hash) throw new Error('密码错误');
    if (u.status === 'pending') throw new Error('账号正在等待管理员审核');
    if (u.status === 'rejected') throw new Error('账号已被禁用，请联系管理员');

    currentUser = { id: u.id, phone: u.phone, name: u.name, dept: u.dept || '', isAdmin: !!u.isAdmin };
    localStorage.setItem('loan_user_v1', JSON.stringify(currentUser));

    hideLogin();
    applyPermissions();
    renderAll();
    toast(`欢迎，${currentUser.name}`, 'ok');
    handlePendingItem();
  } catch (e) {
    toast(e.message, 'err');
  } finally {
    btn.disabled = false; btn.textContent = oldText;
  }
}

async function doRegister() {
  const phone = $('#regPhone').value.trim();
  const name  = $('#regName').value.trim();
  const dept  = $('#regDept').value.trim();
  const pwd   = $('#regPwd').value;
  const pwd2  = $('#regPwd2').value;

  // 前端拦截
  if (!/^1[3-9]\d{9}$/.test(phone)) return toast('手机号格式不正确，请填写 11 位手机号', 'err');
  if (!name) return toast('请填写姓名', 'err');
  if (pwd.length < 4) return toast('密码至少 4 位', 'err');
  if (pwd !== pwd2) return toast('两次密码不一致', 'err');

  const btn = $('#btnRegister');
  const oldText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '正在保存...';

  try {
    await refreshData();
    if (state.users.find(x => x.phone === phone)) {
      throw new Error('该手机号已注册');
    }

    const pwdHash = await hashPwd(phone, pwd);
    const isAdmin = phone === SUPER_ADMIN_PHONE;
    const status = isAdmin ? 'approved' : 'pending';

    state.users.push({
      id: uid(), phone, pwdHash, name, dept, isAdmin, status, createdAt: Date.now()
    });

    const ok = await saveData();
    if (!ok) throw new Error('保存到云端失败，请检查网络');

    toast(isAdmin ? '管理员创建成功，请登录' : '注册成功，请等待管理员审核', 'ok');
    switchLoginTab('login');
    $('#loginPhone').value = phone;
    $('#loginPwd').value = '';
    
    // 清空表单
    $('#regPhone').value = ''; $('#regName').value = ''; $('#regDept').value = ''; 
    $('#regPwd').value = ''; $('#regPwd2').value = '';

    if (isAdmin) $('#loginPwd').focus();
  } catch (e) {
    toast(e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = oldText;
  }
}

function doLogout() {
  localStorage.removeItem('loan_user_v1');
  currentUser = null;
  stopScan();
  showLogin();
}

function applyPermissions() {
  const isAdmin = !!currentUser?.isAdmin;
  $('#btnAddItem').style.display = isAdmin ? '' : 'none';
  $('#btnPrintAll').style.display = isAdmin ? '' : 'none';
  $('#btnExport').style.display = isAdmin ? '' : 'none';
  $('#btnImport').style.display = isAdmin ? '' : 'none';
  $('#btnClearRecords').style.display = isAdmin ? '' : 'none';
  $$('[data-admin]').forEach(el => el.style.display = isAdmin ? '' : 'none');

  if (currentUser) {
    $('#userChip').style.display = 'flex';
    $('#userName').textContent = currentUser.name;
    $('#userRole').textContent = currentUser.isAdmin ? ' · 管理员' : '';
  } else {
    $('#userChip').style.display = 'none';
  }
}

function handlePendingItem() {
  const params = new URLSearchParams(location.search);
  const itemCode = params.get('item');
  if (!itemCode) return;
  const item = state.items.find(i => i.code === itemCode || i.id === itemCode);
  history.replaceState(null, '', location.pathname);
  if (item) {
    openTradeModal(item);
  } else {
    toast('未找到该物品：' + itemCode, 'err');
  }
}

/* ============================================================
 *  事件绑定
 * ============================================================ */
function bindEvents() {
  $$('.login-tab').forEach(t => t.addEventListener('click', () => switchLoginTab(t.dataset.mode)));
  $('#loginPwd').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  $('#btnLogout').addEventListener('click', doLogout);

  $$('.tab').forEach(btn => btn.addEventListener('click', () => {
    $$('.tab').forEach(b => b.classList.toggle('active', b === btn));
    $$('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + btn.dataset.tab));
    if (btn.dataset.tab !== 'scan') stopScan();
  }));

  $('#searchInput').addEventListener('input', renderItems);
  $('#filterStatus').addEventListener('change', renderItems);
  $('#btnAddItem').addEventListener('click', () => openItemModal(null));
  $('#btnPrintAll').addEventListener('click', () => {
    if (!state.items.length) { toast('还没有物品可以打印', 'err'); return; }
    printLabels(state.items);
  });

  $('#itemList').addEventListener('click', e => {
    const btn = e.target.closest('button[data-act]');
    if (!btn || btn.disabled) return;
    const item = state.items.find(i => i.id === btn.dataset.id);
    if (!item) return;

    switch (btn.dataset.act) {
      case 'qr':    openQrModal(item); break;
      case 'trade': openTradeModal(item); break;
      case 'edit':
        if (!currentUser?.isAdmin) { toast('仅管理员可操作', 'err'); return; }
        openItemModal(item);
        break;
      case 'del':
        if (!currentUser?.isAdmin) { toast('仅管理员可操作', 'err'); return; }
        if (confirm(`确定删除「${item.name}」吗？\n删除后该物品的二维码将失效。`)) {
          state.items = state.items.filter(i => i.id !== item.id);
          saveData().then(() => renderAll());
          toast('已删除', 'ok');
        }
        break;
    }
  });

  $('#panel-admin').addEventListener('click', e => {
    const btn = e.target.closest('button');
    if (!btn) return;
    if (btn.dataset.approveUser) approveUser(btn.dataset.approveUser);
    else if (btn.dataset.rejectUser) rejectUser(btn.dataset.rejectUser);
    else if (btn.dataset.approveRec) approveRecord(btn.dataset.approveRec);
    else if (btn.dataset.rejectRec) rejectRecord(btn.dataset.rejectRec);
  });

  $('#btnStartScan').addEventListener('click', startScan);
  $('#btnStopScan').addEventListener('click', stopScan);
  $('#btnScanFile').addEventListener('click', () => $('#qrFile').click());

  $('#qrFile').addEventListener('change', async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (!currentUser) { showLogin(); return; }

    toast('正在解析图片，请稍候...', '');
    const res = await decodeImage(file);
    if (res) {
      const item = findItemByScan(res);
      if (item) openTradeModal(item);
      else alert('识别成功，但未找到对应物品。\n识别内容：' + res);
    } else {
      toast('图片未识别出二维码，请确保二维码清晰无遮挡', 'err');
    }
  });

  $('#btnManual').addEventListener('click', handleManual);
  $('#manualInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleManual();
  });

  function handleManual() {
    if (!currentUser) { showLogin(); return; }
    const v = $('#manualInput').value.trim();
    if (!v) { toast('请输入编号', 'err'); return; }
    const item = findItemByScan(v);
    if (item) {
      $('#manualInput').value = '';
      openTradeModal(item);
    } else {
      toast('未找到编号为「' + v + '」的物品', 'err');
    }
  }

  $('#recordSearch').addEventListener('input', renderRecords);
  $('#btnClearRecords').addEventListener('click', () => {
    if (!currentUser?.isAdmin) { toast('仅管理员可操作', 'err'); return; }
    if (!state.records.length) { toast('暂无记录', 'err'); return; }
    if (confirm('确定清空全部借还记录吗？此操作不可恢复。')) {
      state.records = [];
      saveData().then(() => renderRecords());
      toast('记录已清空', 'ok');
    }
  });
  $('#recordBody').addEventListener('click', e => {
    const btn = e.target.closest('button[data-recid]');
    if (!btn) return;
    if (!currentUser?.isAdmin) { toast('仅管理员可操作', 'err'); return; }
    state.records = state.records.filter(r => r.id !== btn.dataset.recid);
    saveData().then(() => renderRecords());
    toast('记录已删除', 'ok');
  });

  $('#btnExport').addEventListener('click', () => {
    if (!currentUser?.isAdmin) { toast('仅管理员可操作', 'err'); return; }
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `物品借还备份_${todayStr()}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('备份已导出', 'ok');
  });

  $('#btnImport').addEventListener('click', () => {
    if (!currentUser?.isAdmin) { toast('仅管理员可操作', 'err'); return; }
    $('#importFile').click();
  });
  $('#importFile').addEventListener('change', e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if (!d || !Array.isArray(d.items)) throw new Error('格式不正确');
        const msg = `即将导入 ${d.items.length} 件物品、${(d.records || []).length} 条记录`
          + (Array.isArray(d.users) ? `、${d.users.length} 个用户` : '')
          + `。\n\n「确定」= 覆盖当前数据\n「取消」= 放弃导入`;
        if (!confirm(msg)) return;
        state.items = d.items;
        state.records = Array.isArray(d.records) ? d.records : [];
        state.users = Array.isArray(d.users) ? d.users : [];
        saveData().then(() => {
          renderAll();
          verifySession();
        });
        toast('导入成功', 'ok');
      } catch (err) {
        alert('导入失败：文件格式不正确。');
      }
    };
    reader.readAsText(file);
  });
}

/* ============================================================
 *  启动
 * ============================================================ */
async function verifySession() {
  try {
    currentUser = JSON.parse(localStorage.getItem('loan_user_v1') || 'null');
  } catch { currentUser = null; }

  if (!currentUser) { showLogin(); return; }

  await refreshData();
  const u = state.users.find(x => x.id === currentUser.id);
  if (!u || u.status !== 'approved') {
    localStorage.removeItem('loan_user_v1');
    currentUser = null;
    showLogin();
    return;
  }
  currentUser = { id: u.id, phone: u.phone, name: u.name, dept: u.dept || '', isAdmin: !!u.isAdmin };
  localStorage.setItem('loan_user_v1', JSON.stringify(currentUser));

  hideLogin();
  applyPermissions();
  renderAll();
  handlePendingItem();
}

(async function init() {
  bindEvents();
  updateScanButtons();

  await loadData();
  await verifySession();
})();
</script>
